<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điều phối file in</title><style>body{font:16px system-ui;margin:25px;background:#f1f5f9;color:#172334}button{padding:10px;background:#245acc;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.4}input,select,textarea{font:inherit;padding:10px;box-sizing:border-box}textarea{width:100%;height:110px}#layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}#detail{background:white;padding:20px;align-self:start}article{background:white;padding:15px;margin:10px 0;border-radius:8px}img{max-width:46%;max-height:260px;object-fit:contain;margin:5px}p{line-height:1.6}.error{color:#c21}details{margin:12px 0}@media(max-width:850px){#layout{display:block}}</style>
<h1>Điều phối file in</h1><p>Hồ sơ chưa hoàn thành · Lệnh xuất bản mới chỉ để duyệt nội bộ · Chưa RIP/gửi khách hoặc tạo lại đơn ERP.</p><button onclick="refresh()">Làm mới</button><p id="summary"></p><p id="error" class="error"></p><details><summary>Trạng thái hệ thống</summary><div id="status"></div></details><input id="search" placeholder="Tìm tên mẫu / lý do" oninput="render()"><select id="filter" onchange="render()"><option value="all">Cần xử lý / chưa hoàn thành</option><option value="history">Lịch sử đã xong / đã đóng</option><option value="review">Cần kiểm tra</option><option value="not_started">Chưa bắt đầu</option><option value="running">Đang chờ / chạy</option></select><div id="layout"><section id="list"></section><section id="detail">Chọn hồ sơ để xem nguồn và điều phối.</section></div>
<script>
let rows=[],history=[],csrf='',selected='';const embedded=new URLSearchParams(location.hash.slice(1)).get('brief');const labels={review:'Cần kiểm tra',not_started:'Chưa bắt đầu',done:'Hoàn tất',queued:'Chờ xử lý',reading:'Đang đọc',awaiting_upload:'Chờ lấy nguồn',planning:'Đang phân tích',scheduled:'Đã xếp hàng',exporting:'Đang xuất',publishing:'Đang gửi preview',uncertain:'Chưa rõ kết quả',archived:'Đã đóng',superseded:'Đã thay thế'},busy=['scheduled','planning','awaiting_upload','queued','reading','exporting','publishing','uncertain'];
const $=id=>document.getElementById(id);function el(t,text){let e=document.createElement(t);e.textContent=text;return e}async function api(path,options){let r=await fetch(path,options),d=await r.json();if(!r.ok)throw Error(d.detail||'Không kết nối được');return d}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('list').replaceChildren();for(let x of (f==='history'?history:rows)){if(!(x.title+' '+x.reason).toLowerCase().includes(q))continue;if(f==='review'&&!['review','uncertain'].includes(x.state))continue;if(f==='not_started'&&x.state!==f)continue;if(f==='running'&&!busy.includes(x.state))continue;let a=el('article',''),b=el('button','Xem / điều phối');a.append(el('h3',x.title),el('p',labels[x.state]||x.state),el('p',x.reason||''));b.onclick=()=>show(x.id);a.append(b);$('list').append(a)}}
async function refresh(){try{let [s,d]=await Promise.all([api('/api/status'),api('/api/dispatch')]);rows=d.pending;history=d.history||[];render();$('summary').textContent=rows.length+' hồ sơ chưa hoàn thành · '+d.completed+' hồ sơ hoàn thành/đã đóng được ẩn (trong '+d.limit+' hồ sơ gần nhất)';$('status').replaceChildren();for(let c of s.cards)$('status').append(el('p',c.name+' ['+c.state+']: '+c.detail));$('error').textContent=Date.now()/1000-s.updated>90?'Dữ liệu trạng thái đã cũ':''}catch(e){$('error').textContent=e.message}}
async function show(id){selected=id;let b=$('detail');b.textContent='Đang đọc…';try{let d=await api('/api/dispatch/'+id);if(selected!==id)return;b.replaceChildren(el('h2',d.title));for(let i of d.images){if(!['image/png','image/jpeg','image/webp'].includes(i.mime_type))continue;let img=document.createElement('img');img.src='data:'+i.mime_type+';base64,'+i.data;b.append(img)}let req=el('details','');req.append(el('summary','Nội dung đã tổng hợp'));for(let x of d.requirements)req.append(el('p',x.text||''));b.append(req,el('p','Thiếu đã ghi nhận: '+(d.missing.join(', ')||'Không có')),el('h3','Tiến trình và nguyên nhân'));for(let j of d.jobs)b.append(el('p',j.kind+' — '+(labels[j.state]||j.state)+(j.reason?' · '+j.reason:'')+(j.path?' · '+j.path:'')));diagnostics(d,b);b.append(el('h3','Yêu cầu xử lý mới'));let source=document.createElement('select');source.style.width='100%';for(let a of d.assets)if(a.exportable){let o=el('option',a.name);o.value=a.sha256;source.append(o)}if(!source.options.length&&d.image_context==='standalone_artwork'){let o=el('option','Ảnh artwork riêng trong hồ sơ');o.value='';source.append(o)}b.append(el('p','Chọn đúng file nguồn:'),source);nativePanel(d,b,source);let note=document.createElement('textarea');note.placeholder='Ghi yêu cầu: artwork/vị trí cần lấy, kích thước, điều cần chỉnh so với lần trước…';b.append(el('p','Yêu cầu của anh (bắt buộc):'),note,el('p','Chạy phân tích lại và xuất nếu đủ điều kiện. Thay màu/vẽ lại chưa hỗ trợ sẽ báo kiểm tra, không tự coi là đã sửa xong.'));let submit=el('button','Phân tích và xuất bản mới'),msg=el('p','');submit.disabled=!source.options.length||!d.current||d.jobs.some(x=>busy.includes(x.state));if(submit.disabled)b.append(el('p','Chưa thể chạy thêm: cần nguồn phù hợp, hồ sơ hiện tại và không có lượt đang chạy/chưa rõ kết quả.'));submit.onclick=async()=>{if(note.value.trim().length<5){msg.textContent='Hãy ghi yêu cầu cụ thể.';return}submit.disabled=true;try{let x=await api('/api/dispatch/'+id,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({note:note.value,sha256:source.value})});msg.textContent=x.message;refresh()}catch(e){msg.textContent=e.message;submit.disabled=false}};b.append(submit,msg)}catch(e){b.textContent=e.message}}
function diagnostics(d,b){
 const section=el('section','');section.append(el('h3','Chi tiết đọc nguồn / chọn artwork'));
 section.append(el('p','Artboard là khổ trang; cụm artwork là đối tượng cần in. Bản đọc mới ghi riêng artboard và cụm artwork. Không suy ra khổ trang từ kích thước cụm.'));
 for(const check of d.source_checks||[]){let detail=el('details','');detail.append(el('summary','Phân tích nguồn: '+check.file+' · '+check.state));let pre=el('pre',JSON.stringify(check,null,2));pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';detail.append(pre);section.append(detail)}
 const records=d.native||[];
 if(!records.length)section.append(el('p','Chưa có kết quả đọc cụm Illustrator trong hồ sơ này. Xem tiến trình phía trên để biết bước trước đang chờ hay lỗi; không đồng nghĩa file không có artwork.'));
 for(const x of records){
  const panel=el('details','');panel.open=!!x.error||x.auto_status==='review';
  panel.append(el('summary',(x.asset?.name||'Nguồn chưa có tên')+' · '+x.state+' · '+(x.auto_status||'Chưa có quyết định AI')));
  panel.append(el('p','Mã lượt: '+x.id),el('p','Mã nguồn: '+(x.asset?.sha256||'Chưa ghi nhận')));
  if(x.error){let err=el('p','Lý do chặn: '+x.error);err.className='error';panel.append(err)}
  if(x.blocked_parts?.length)panel.append(el('p','Xuất từng phần — phần cần bổ sung (không chặn các vị trí đủ nguồn): '+x.blocked_parts.join('; ')));
  for(const region of x.artboard_regions||[]){const board=x.scan?.artboards?.find(a=>a.index===region.artboard_index);if(board?.preview){let wrap=el('div','');wrap.style.cssText='position:relative;width:100%';let img=el('img','');img.src='data:image/png;base64,'+board.preview;img.style.cssText='display:block;max-width:100%;max-height:none;margin:0;width:100%';wrap.append(img);let mark=el('div','');let q=region.box;mark.style.cssText='position:absolute;border:2px solid red;box-sizing:border-box;left:'+(q[0]*100)+'%;top:'+(q[1]*100)+'%;width:'+((q[2]-q[0])*100)+'%;height:'+((q[3]-q[1])*100)+'%';wrap.append(mark);panel.append(el('p','Vùng chọn trên artboard: '+region.description),wrap)}}
  if(x.maket_filter){panel.append(el('p','Đối chiếu maket: '+x.maket_filter.total+' cụm → giữ '+x.maket_filter.kept.length));let excluded=el('details','');excluded.append(el('summary','Cụm đã loại và lý do'));for(const item of x.maket_filter.excluded)excluded.append(el('p',item.id+': '+item.reason));panel.append(excluded)}
  for(const region of x.maket_regions||[]){let compare=el('div','');compare.append(el('h4','Vùng maket ↔ artwork: '+region.side),el('p',region.description));let image=el('img','');image.src='data:image/png;base64,'+region.preview;image.alt='Vùng maket AI xác định';compare.append(image);for(const id of region.candidate_ids){let c=x.scan?.candidates?.find(c=>c.id===id);if(c){let img=el('img','');img.src='data:image/png;base64,'+c.preview;img.style.background='#777';img.alt='Cụm '+id;compare.append(img,el('span',id))}}panel.append(compare)}
  const scan=x.scan;
  if(scan){for(const board of scan.artboards||[])panel.append(el('p','Artboard '+board.index+' '+board.name+': '+Number(board.width_cm).toFixed(2)+' × '+Number(board.height_cm).toFixed(2)+' cm'));
   panel.append(el('p','Đã đọc '+(scan.candidates||[]).length+' cụm · Danh sách đầy đủ: '+(scan.truncated?'KHÔNG — bị giới hạn, có thể chưa chứa artwork cần in':'Không bị đánh dấu cắt bớt')));
   if(scan.truncated)panel.append(el('p','Cần kiểm tra các cụm đã có bên dưới. Không nên chạy lại y nguyên nhiều lần: cần sửa cách đọc/phân nhóm hoặc chọn nguồn chỉ chứa artwork cần in.'));
   panel.append(el('p','Font thiếu: '+((scan.missing_fonts||[]).join(', ')||'Không được ghi nhận')));
   let table=el('table','');table.style.cssText='width:100%;border-collapse:collapse;font-size:13px';
   let head=el('tr','');for(const title of ['ID / loại','Tên','Ngang × cao (cm)','Chữ sống'])head.append(el('th',title));table.append(head);
   for(const c of scan.candidates||[]){let row=el('tr','');for(const v of [c.id+' / '+c.kind,c.name||'—',Number(c.width_cm).toFixed(2)+' × '+Number(c.height_cm).toFixed(2),String(c.live_text_count??'Chưa rõ')]){let cell=el('td',v);cell.style.cssText='border:1px solid #ddd;padding:5px;word-break:break-word';row.append(cell)}table.append(row)}panel.append(table);
  }else panel.append(el('p','Lượt này không chứa danh sách cụm; xem lượt đọc nguồn tương ứng.'));
  panel.append(el('p','Cụm đã chọn: '+((x.candidate_ids||[]).join(', ')||'Chưa ghi nhận')+' · Vị trí: '+(x.side||'Chưa ghi nhận')+' · Ngang xuất: '+(x.width_cm?x.width_cm+' cm':'Chưa xác định')));
  for(const [label,value] of [['Giải thích lựa chọn AI',x.decision_summary],['Yêu cầu đã gửi',x.note],['Căn cứ kích thước / nguồn',x.auto_context]])if(value){let a=el('details','');a.append(el('summary',label));let pre=el('pre',typeof value==='string'?value:JSON.stringify(value,null,2));pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';a.append(pre);panel.append(a)}
  section.append(panel);
 }
 b.append(section);
}
function nativePanel(d,b,source){
 const box=el('section','');b.append(box);let selectedSide='';
 const draw=()=>{
  box.replaceChildren(el('h3','Cụm artwork Illustrator'));
  let scans=(d.native||[]).filter(x=>x.asset.sha256===source.value),scan=scans.find(x=>x.state==='candidates_ready');
  const message=el('p','');
  async function send(data,button){button.disabled=true;try{let r=await api('/api/dispatch/'+d.id,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({...data,sha256:source.value})});message.textContent=r.message;refresh()}catch(e){message.textContent=e.message;button.disabled=false}}
  const states={candidates_ready:'Đã đọc các cụm',scan_queued:'Chờ đọc cụm',scan_running:'Illustrator đang đọc cụm',render_queued:'Chờ xuất PNG',render_running:'Illustrator đang xuất PNG',png_check_queued:'AI đang kiểm tra PNG với nguồn',png_ready:'PNG đã xong — xem bước TIFF ở tiến trình phía trên',review:'Cần kiểm tra',superseded:'Đã có phiên bản mới'};let reload=el('button','Làm mới hồ sơ');reload.onclick=()=>show(d.id);box.append(reload);
  for(let x of scans)box.append(el('p',(states[x.state]||x.state)+(x.auto_selected?' · AI tự chọn '+(x.side||'front'):'')+(x.auto_status?' · '+({waiting_scan:'Chờ đọc cụm',planning:'AI đang chọn',selected:'AI đã chọn',waiting_verify:'Chờ kiểm chứng PNG',verifying:'Đang kiểm chứng PNG',verified:'PNG đã đạt kiểm tra',review:'Cần kiểm tra'}[x.auto_status]||x.auto_status):'')+(x.error?' — '+x.error:'')));
  for(let x of scans)if(x.decision_summary){let audit=el('details','');audit.append(el('summary','Kết quả đối chiếu lại AI · '+(x.side||'chọn artwork')));for(let v of Object.values(x.decision_summary))audit.append(el('p',v));box.append(audit)}
  if(!scan){let button=el('button','Đọc các cụm bằng Illustrator');button.disabled=!source.value||scans.some(x=>x.state.includes('running')||x.state.includes('queued'));button.onclick=()=>send({action:'native_scan'},button);box.append(button,message);return}
  let warnings=scan.scan.missing_fonts||[];box.append(el('p',warnings.length?'Thiếu font nguồn: '+warnings.join(', ')+'. Cụm có chữ sống sẽ bị chặn xuất; cụm outline/ảnh vẫn có thể làm mẫu.':'Không phát hiện font nguồn thiếu theo tên PostScript.'));
  if(scan.scan.truncated)box.append(el('p','Danh sách vượt giới hạn; kết quả đọc cũ bị cắt bớt. Chưa coi là đã đọc đủ.'));
  box.append(el('p','Chọn một cụm đầy đủ hoặc các cụm con cần ghép. Không chọn đồng thời cha/con. Ảnh trên nền xám để thấy chi tiết trắng.'));
  let grid=el('div','');grid.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px';let checks=[];
  let exports=scans.filter(x=>x.candidate_ids);let sides=[...new Set(exports.map(x=>x.side||'front'))];if(!sides.length)sides=['front'];if(!selectedSide)selectedSide=sides[0];let sideSelect=document.createElement('select');for(let side of sides){let o=el('option',side);o.value=side;sideSelect.append(o)}sideSelect.value=selectedSide;sideSelect.onchange=()=>{selectedSide=sideSelect.value;draw()};box.append(el('p','Vị trí đang xem / chọn lại:'),sideSelect);let previous=exports.find(x=>(x.side||'front')===selectedSide);
  for(let c of [...scan.scan.candidates].sort((a,b)=>Number(!!previous?.candidate_ids.includes(b.id))-Number(!!previous?.candidate_ids.includes(a.id))||Number(b.kind==='GroupItem')-Number(a.kind==='GroupItem'))){let label=el('label',''),check=document.createElement('input'),img=document.createElement('img');check.type='checkbox';check.value=c.id;check.checked=!!previous?.candidate_ids.includes(c.id);checks.push(check);img.src='data:image/png;base64,'+c.preview;img.style.cssText='display:block;max-width:100%;height:140px;margin:auto;background:#aaa';label.style.cssText='border:1px solid #ccc;padding:8px';label.append(check,el('span',' '+c.id+' · '+c.kind),img,el('small',c.width_cm.toFixed(2)+' × '+c.height_cm.toFixed(2)+' cm · chữ sống: '+c.live_text_count));grid.append(label)}
  box.append(grid);let width=document.createElement('input');width.type='number';width.step='.01';width.min='.1';width.max='160';width.value=previous?.width_cm||'';let note=document.createElement('textarea');note.placeholder='Căn cứ kích thước / lựa chọn cụm; chỉ xuất nguyên artwork, chưa chỉnh màu.';note.value=previous?.note||'';box.append(el('p','Chiều ngang xuất (cm); chiều cao giữ đúng tỷ lệ:'),width,el('p','Ghi chú đối chiếu:'),note);
  let button=el('button','Xuất PNG/TIFF các cụm đã chọn');button.onclick=()=>send({action:'native_export',scan_id:scan.id,side:selectedSide,candidate_ids:checks.filter(x=>x.checked).map(x=>x.value),width_cm:Number(width.value),note:note.value},button);box.append(button,message);
 };source.addEventListener('change',draw);draw();
}

api('/api/session').then(d=>{csrf=d.csrf;refresh();if(embedded&&/^[a-f0-9]{64}$/.test(embedded)){document.querySelector('h1').textContent='Điều phối hồ sơ của đơn';$('list').style.display='none';$('search').style.display='none';$('filter').style.display='none';$('layout').style.display='block';show(embedded)}});setInterval(refresh,20000);
</script></html>
