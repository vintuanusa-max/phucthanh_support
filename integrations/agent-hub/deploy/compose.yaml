# Docker Desktop Linux containers. Start from this directory using .env.
name: phucthanh-chatwoot
x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.18.0
  env_file: .env
  environment:
    RAILS_ENV: production
    NODE_ENV: production
    INSTALLATION_ENV: docker
    POSTGRES_HOST: postgres
    POSTGRES_DATABASE: chatwoot
    POSTGRES_USERNAME: postgres
    REDIS_URL: redis://redis:6379
    ACTIVE_STORAGE_SERVICE: local
    FRONTEND_URL: http://localhost:3000
    ENABLE_ACCOUNT_SIGNUP: 'false'
    SAFE_FETCH_ALLOW_PRIVATE_NETWORK: 'true'
    FORCE_SSL: 'false'
  volumes:
    - storage:/app/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  rails:
    <<: *chatwoot
    ports:
      - '127.0.0.1:3000:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
  sidekiq:
    <<: *chatwoot
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  hub:
    build: ..
    env_file: .env
    environment:
      HUB_DATABASE: /data/hub.sqlite3
      CW_URL: http://rails:3000
    ports:
      - '127.0.0.1:8095:8095'
    volumes:
      - hub:/data
    restart: unless-stopped
volumes:
  postgres:
  redis:
  storage:
  hub:

