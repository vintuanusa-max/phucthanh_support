<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đơn & file in · Phúc Thanh</title><style>body{font:16px system-ui;margin:25px;background:#f1f5f9;color:#172334}button{padding:10px;background:#245acc;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.4}input,select,textarea{font:inherit;padding:10px;box-sizing:border-box}textarea{width:100%;height:110px}#layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}#detail{min-width:0;overflow-wrap:anywhere;background:white;padding:20px;align-self:start}article{background:white;padding:15px;margin:10px 0;border-radius:8px}img{max-width:46%;max-height:260px;object-fit:contain;margin:5px}p{line-height:1.6}.error{color:#c21}details{margin:12px 0}@media(max-width:850px){#layout{display:block}}</style>
<h1>Điều phối file in</h1><p>Hồ sơ chưa hoàn thành · Lệnh xuất bản mới chỉ để duyệt nội bộ · Chưa RIP/gửi khách hoặc tạo lại đơn ERP.</p><button onclick="refresh()">Làm mới</button><details><summary onclick="managementSettings()">Quản lý API / quy tắc / lịch sử cấu hình</summary><div id="management-settings"></div></details><section id="zalo-sender" aria-live="polite">Đang đọc trạng thái bộ gửi Zalo…</section><div id="audit-links"></div><p id="summary"></p><p id="error" class="error"></p><details><summary>Trạng thái hệ thống</summary><div id="status"></div></details><input id="search" placeholder="Tìm tên mẫu / lý do" oninput="render()"><select id="filter" onchange="render()"><option value="all">Cần xử lý / chưa hoàn thành</option><option value="history">Lịch sử đã xong / đã đóng</option><option value="review">Cần kiểm tra</option><option value="not_started">Chưa bắt đầu</option><option value="running">Đang chờ / chạy</option></select><div id="layout"><section id="list"></section><section id="detail">Chọn hồ sơ để xem nguồn và điều phối.</section></div>
<script>
let rows=[],history=[],csrf='',selected='';const embedded=new URLSearchParams(location.hash.slice(1)).get('brief');const labels={review:'Cần kiểm tra',not_started:'Chưa bắt đầu',done:'Hoàn tất',queued:'Chờ xử lý',reading:'Đang đọc',awaiting_upload:'Chờ lấy nguồn',planning:'Đang phân tích',scheduled:'Đã xếp hàng',exporting:'Đang xuất',publishing:'Đang gửi preview',uncertain:'Chưa rõ kết quả',archived:'Đã đóng',superseded:'Đã thay thế'},busy=['scheduled','planning','awaiting_upload','queued','reading','exporting','publishing','uncertain'];
const $=id=>document.getElementById(id);function el(t,text){let e=document.createElement(t);e.textContent=text;return e}async function api(path,options){let r=await fetch(path,options),d=await r.json();if(!r.ok)throw Error(d.detail||'Không kết nối được');return d}
function formatCreated(value){const n=Number(value);return Number.isFinite(n)&&n>0?new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(n*1000)):'Chưa có thời gian'}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('list').replaceChildren();for(let x of (f==='history'?history:rows)){if(!(x.title+' '+x.reason).toLowerCase().includes(q))continue;if(f==='review'&&!['review','uncertain'].includes(x.state))continue;if(f==='not_started'&&x.state!==f)continue;if(f==='running'&&!busy.includes(x.state))continue;let a=el('article',''),b=el('button','Xem / điều phối');a.append(el('h3',x.title),el('p','Tạo hồ sơ: '+formatCreated(x.created)+' (giờ Việt Nam)'),el('p',(x.state==='collecting_sources'?'Đang gom nguồn':x.state==='waiting_sources'?'Chờ đủ nguồn':labels[x.state]||x.state)),el('p',x.reason||''));b.onclick=()=>show(x.id);a.append(b);$('list').append(a)}}
async function refresh(){try{let [s,d]=await Promise.all([api('/api/status'),api('/api/dispatch')]);rows=d.pending;history=d.history||[];render();$('summary').textContent=rows.length+' hồ sơ chưa hoàn thành · '+d.completed+' hồ sơ hoàn thành/đã đóng được ẩn (trong '+d.limit+' hồ sơ gần nhất) · Mới nhất ở trên — theo thời gian tạo hồ sơ';$('status').replaceChildren();for(let c of s.cards)$('status').append(el('p',c.name+' ['+c.state+']: '+c.detail));$('error').textContent=Date.now()/1000-s.updated>90?'Dữ liệu trạng thái đã cũ':''}catch(e){$('error').textContent=e.message}}
async function show(id){selected=id;let b=$('detail');b.textContent='Đang đọc…';try{let d=await api('/api/dispatch/'+id);if(selected!==id)return;b.replaceChildren(el('h2',d.title));if(d.sample_only){b.append(el('p','Lên mẫu · Không tạo đơn ERP · Chỉ duyệt nội bộ'));for(const r of d.requirements||[])b.append(el('p',typeof r==='string'?r:r.text||''));b.append(el('h3','Tiến trình và nguyên nhân'));for(const j of d.jobs||[])b.append(el('p',(labels[j.state]||j.state)+' · '+(j.reason||'')),el('p',j.path||''));return;}for(let i of d.images){if(!['image/png','image/jpeg','image/webp'].includes(i.mime_type))continue;let img=document.createElement('img');img.src='data:'+i.mime_type+';base64,'+i.data;b.append(img)}let req=el('details','');req.append(el('summary','Nội dung đã tổng hợp'));for(let x of d.requirements)req.append(el('p',x.text||''));b.append(req,el('p','Thiếu đã ghi nhận: '+(d.missing.join(', ')||'Không có')),el('h3','Tiến trình và nguyên nhân'));for(let j of d.jobs)b.append(el('p',j.kind+' — '+(labels[j.state]||j.state)+(j.reason?' · '+j.reason:'')+(j.path?' · '+j.path:'')));managementPanel(d,b);flowEvidence(d,b);diagnostics(d,b);b.append(el('h3','Yêu cầu xử lý mới'));let source=document.createElement('select');source.style.width='100%';for(let a of d.assets)if(a.exportable){let o=el('option',a.name);o.value=a.sha256;source.append(o)}if(!source.options.length&&d.image_context==='standalone_artwork'){let o=el('option','Ảnh artwork riêng trong hồ sơ');o.value='';source.append(o)}b.append(el('p','Chọn đúng file nguồn:'),source);nativePanel(d,b,source);let note=document.createElement('textarea');note.placeholder='Ghi yêu cầu: artwork/vị trí cần lấy, kích thước, điều cần chỉnh so với lần trước…';b.append(el('p','Yêu cầu của anh (bắt buộc):'),note,el('p','Chạy phân tích lại và xuất nếu đủ điều kiện. Thay màu/vẽ lại chưa hỗ trợ sẽ báo kiểm tra, không tự coi là đã sửa xong.'));let submit=el('button','Phân tích và xuất bản mới'),msg=el('p','');submit.disabled=!source.options.length||!d.current||d.jobs.some(x=>busy.includes(x.state));if(submit.disabled)b.append(el('p','Chưa thể chạy thêm: cần nguồn phù hợp, hồ sơ hiện tại và không có lượt đang chạy/chưa rõ kết quả.'));submit.onclick=async()=>{if(note.value.trim().length<5){msg.textContent='Hãy ghi yêu cầu cụ thể.';return}submit.disabled=true;try{let x=await api('/api/dispatch/'+id,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':csrf},body:JSON.stringify({note:note.value,sha256:source.value})});msg.textContent=x.message;refresh()}catch(e){msg.textContent=e.message;submit.disabled=false}};b.append(submit,msg)}catch(e){b.textContent=e.message}}
const FLOW_AUDITS={};
function flowEvidence(d,b){
 const roots=(d.native||[]).filter(x=>x.auto_context===x.id&&x.scan);
 if(!roots.length)return;
 const section=el('section','');section.className='flow-evidence';section.append(el('h3','Luồng theo từng bước — đối chiếu bằng chứng'));
 const chooser=el('select','');chooser.style.width='100%';for(const x of roots){const op=el('option',(x.asset?.name||'Nguồn')+' · '+x.id.slice(0,12)+' · '+(x.ai_calls?.artboard_regions_v5_partial?.model||'Model không được lưu'));op.value=x.id;chooser.append(op)}
 const content=el('div','');section.append(chooser,content);b.append(section);
 function picture(parent,data,label){if(!data)return;const fig=el('figure','');fig.style.margin='8px 0';const im=el('img','');im.src='data:image/png;base64,'+data;im.alt=label;im.style.cssText='max-width:100%;width:auto;max-height:650px;background:#777;margin:0';fig.append(im,el('figcaption',label));parent.append(fig)}
 function draw(){content.replaceChildren();const x=roots.find(v=>v.id===chooser.value),children=(d.native||[]).filter(v=>v.id!==x.id&&v.auto_context===x.id),audit=FLOW_AUDITS[x.id];
 function step(title,status){const box=el('article','');box.style.cssText='border-left:4px solid #4778be;margin:0 0 12px 12px;padding:14px;background:#f8fafc';box.append(el('h4',title),el('p',status));content.append(box);return box}
 if(audit){const note=el('p',audit.summary);note.className='error';content.append(note,el('p','Ghi nhận kiểm tra ngày 24/10/2026. Đây là kết luận đối chiếu, không tự sửa trạng thái hay chạy lại hồ sơ.'))}
 let s=step('1. Nguồn và maket',x.asset?.name||'Chưa có nguồn');s.append(el('p','SHA256: '+(x.asset?.sha256||'—')));for(const im of d.images||[])picture(s,im.data,'Ảnh nguồn trong hồ sơ; xem bước 2 để biết ảnh artboard thực sự gửi AI.');
 s=step('2. Illustrator đọc artboard',`${x.scan.artboards?.length||0} artboard · ${x.scan.candidates?.length||0} đối tượng metadata; không phải số ảnh gửi AI.`);
 for(const board of x.scan.artboards||[])s.append(el('p',`Artboard ${board.index}: ${Number(board.width_cm).toFixed(2)} × ${Number(board.height_cm).toFixed(2)} cm; bounds ${JSON.stringify(board.bounds)}`));
 s=step('3. AI khoanh vùng trên ảnh artboard',Object.entries(x.ai_calls||{}).filter(([k])=>k.startsWith('artboard_regions')).map(([k,v])=>`${v.model||'Model cũ không ghi'} · ${v.state} · ${v.image_count??'không ghi'} ảnh`).join('; '));
 for(const board of x.scan.artboards||[]){if(!board.preview)continue;const wrap=el('div','');wrap.style.cssText='position:relative;max-width:800px';const im=el('img','');im.src='data:image/png;base64,'+board.preview;im.style.cssText='display:block;width:100%;max-width:100%;max-height:none;margin:0';wrap.append(im);for(const region of x.artboard_regions||[]){if(region.artboard_index!==board.index)continue;const q=region.box,mark=el('div','');mark.style.cssText=`position:absolute;border:3px solid red;box-sizing:border-box;left:${q[0]*100}%;top:${q[1]*100}%;width:${(q[2]-q[0])*100}%;height:${(q[3]-q[1])*100}%`;wrap.append(mark)}s.append(wrap)}
 for(const r of x.artboard_regions||[])s.append(el('p',r.description+' · box '+JSON.stringify(r.box)));
 s=step('4. Lọc group theo vùng',x.maket_filter?`${x.maket_filter.total} đối tượng → ${x.maket_filter.kept?.length||0} ứng viên: ${(x.maket_filter.kept||[]).join(', ')}`:x.error||'Chưa đến bước lọc');
 for(const id of x.maket_filter?.kept||[]){const c=x.scan.candidates.find(v=>v.id===id);if(c)picture(s,c.preview,`${id} · ${c.kind} · ${Number(c.width_cm).toFixed(3)} × ${Number(c.height_cm).toFixed(3)} cm`)}
 s=step('5. AI quyết định chọn đối tượng',x.ai_calls?.selection_partial_v1?`${x.ai_calls.selection_partial_v1.model||'Model cũ không ghi'} · ${x.ai_calls.selection_partial_v1.state} · ${x.ai_calls.selection_partial_v1.image_count??'không ghi'} ảnh`:'Chưa chạy chọn group');
 for(const face of x.auto_plan?.faces||[]){s.append(el('p',`${face.side}: group ${(face.candidate_ids||[]).join(', ')} · ngang ${face.width_cm} cm; ${face.explanation||''}`));if(face.maket_region)s.append(el('p','AI mô tả maket: '+face.maket_region.description));}
 s=step('6. Xuất PNG / AI / TIFF',children.length?children.map(v=>`${v.id.slice(0,12)}: ${v.state} · ${(v.candidate_ids||[]).join(', ')}`).join('; '):'Chưa tạo lượt xuất');
 if(audit?.output)picture(s,audit.output,'Ảnh PNG thực xuất — bằng chứng lượt thử này');if(audit?.exportNote)s.append(el('p',audit.exportNote));
 s=step('7. Kiểm tra sau xuất và kết luận',audit?.verdict||'Xem kết quả AI bên dưới; trạng thái máy không thay thế duyệt của nhân viên.');
 for(const child of children){for(const [key,v] of Object.entries(child.ai_calls||{})){if(!key.startsWith('png'))continue;const det=el('details','');det.append(el('summary',`${key} · ${v.model||'Model cũ không ghi'} · ${v.state}`));const pre=el('pre',JSON.stringify(v.result,null,2));pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';det.append(pre);s.append(det)}if(child.error){let p=el('p',child.error);p.className='error';s.append(p)}}
 if(audit?.history){s=step('8. So sánh lịch sử và hướng điều tra',audit.history);if(audit.previousIds)s.append(el('p','Lượt đối chiếu: '+audit.previousIds));}
 }
 chooser.onchange=draw;draw();
}

function diagnostics(d,b){
 const section=el('section','');section.append(el('h3','Chi tiết đọc nguồn / chọn artwork'));
 section.append(el('p','Artboard là khổ trang; cụm artwork là đối tượng cần in. Bản đọc mới ghi riêng artboard và cụm artwork. Không suy ra khổ trang từ kích thước cụm.'));
 for(const entry of d.print_catalogs||[]){
  const box=el('details','');box.open=true;box.append(el('summary','Phân loại artboard / phần cần in: '+entry.file));
  const cat=entry.catalog;
  box.append(el('p','Đã đọc '+cat.source_pages.length+' trang nguồn. Phân loại chưa đồng nghĩa đã xuất.'));
  for(const b of cat.boards||[])box.append(el('p','Trang '+b.page+' · '+b.role+' · '+b.model_codes.join(', ')+' — '+b.description));
  for(const m of cat.models||[]){box.append(el('h4',m.code));
   for(const p of m.parts||[]){const card=el('div','');card.className='card';
    card.append(el('strong',p.name+' · '+p.kind+' · '+p.status));
    card.append(el('p','Trang: '+p.boards.join(', ')+' | Nền: '+p.background+' | Hướng: '+p.orientation));
    card.append(el('p','Kích thước nguồn: '+p.dimensions+' | Chu kỳ: '+p.repeat));
    card.append(el('p','Bước tiếp: '+p.next_step));
    for(const issue of p.missing||[])card.append(el('p','Cần kiểm tra: '+issue));
    card.append(el('small','Bằng chứng: '+p.sources.join(', ')));box.append(card);
   }
  }
  for(const issue of cat.issues||[])box.append(el('p','Lưu ý: '+issue));section.append(box);
 }
 for(const check of d.source_checks||[]){let detail=el('details','');detail.append(el('summary','Phân tích nguồn: '+check.file+' · '+check.state));let pre=el('pre',JSON.stringify(check,null,2));pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';detail.append(pre);section.append(detail)}
 const records=d.native||[];
 if(!records.length)section.append(el('p','Chưa có kết quả đọc cụm Illustrator trong hồ sơ này. Xem tiến trình phía trên để biết bước trước đang chờ hay lỗi; không đồng nghĩa file không có artwork.'));
 for(const x of records){
  const panel=el('details','');panel.open=!!x.error||x.auto_status==='review'||!!x.region_correction_audit;
  panel.append(el('summary',(x.asset?.name||'Nguồn chưa có tên')+' · '+x.state+' · '+(x.auto_status||'Chưa có quyết định AI')));
  panel.append(el('p','Mã lượt: '+x.id),el('p','Mã nguồn: '+(x.asset?.sha256||'Chưa ghi nhận')));
  if(x.error){let err=el('p','Lý do chặn: '+x.error);err.className='error';panel.append(err)}
  if(x.blocked_parts?.length)panel.append(el('p','Xuất từng phần — phần cần bổ sung (không chặn các vị trí đủ nguồn): '+x.blocked_parts.join('; ')));
  if(x.region_correction_audit){
   panel.append(el('h3','Dấu vết lần chọn ban đầu → sau can thiệp'),el('p','ĐỎ: vùng AI chọn ban đầu. XANH: vùng đã sửa. Đây là lần có can thiệp, không phải kết quả tự động hoàn toàn.'));
   for(const original of x.region_correction_audit.original?.result?.regions||[]){
    const board=x.scan?.artboards?.find(a=>a.index===original.artboard_index);if(!board?.preview)continue;
    const wrap=el('div','');wrap.style.cssText='position:relative;width:100%;max-width:700px';const img=el('img','');img.src='data:image/png;base64,'+board.preview;img.style.cssText='display:block;width:100%;max-width:100%;max-height:none;margin:0';wrap.append(img);
    for(const [region,color] of [[original,'red'],...(x.artboard_regions||[]).filter(r=>r.artboard_index===board.index).map(r=>[r,'#00a044'])]){const q=region.box;const box=el('div','');box.style.cssText=`position:absolute;border:3px solid ${color};box-sizing:border-box;left:${q[0]*100}%;top:${q[1]*100}%;width:${(q[2]-q[0])*100}%;height:${(q[3]-q[1])*100}%`;wrap.append(box)}
    panel.append(wrap);
    const [l,t,r,b]=board.bounds,w=r-l,h=t-b,q=original.box,tol=Math.min(w,h)*.01;
    const inside=(x.scan.candidates||[]).filter(c=>c.bounds[0]>=l+q[0]*w-tol&&c.bounds[2]<=l+q[2]*w+tol&&c.bounds[1]<=t-q[1]*h+tol&&c.bounds[3]>=t-q[3]*h-tol);
    const roots=inside.filter(c=>!inside.some(a=>a.id!==c.id&&c.id.startsWith(a.id+'.')));
    panel.append(el('p',`1. Illustrator đọc ${x.scan.candidates.length} đối tượng (metadata, không phải số ảnh gửi AI). 2. Vùng AI ban đầu giữ ${roots.length} ứng viên. 3. Giới hạn chọn chi tiết: 12 ứng viên.`));
    const detail=el('details','');detail.append(el('summary','Xem các đối tượng bộ lọc ban đầu giữ lại'));for(const c of roots)detail.append(el('p',`${c.id} · ${c.kind} · ${c.width_cm.toFixed(3)} × ${c.height_cm.toFixed(3)} cm`));panel.append(detail);
   }
   panel.append(el('p','Nguyên nhân: bộ lọc yêu cầu toàn bộ bounds nằm trong vùng AI. Vùng lệch có thể loại group cha đầy đủ nhưng giữ các nét con.'));
   for(const id of x.maket_filter?.kept||[]){const c=x.scan?.candidates?.find(v=>v.id===id);if(!c)continue;panel.append(el('p',`Sau chỉnh: ${id} · ${c.kind} · ${c.width_cm.toFixed(3)} × ${c.height_cm.toFixed(3)} cm · chữ sống: ${c.live_text_count}`));const im=el('img','');im.src='data:image/png;base64,'+c.preview;im.style.background='#777';im.alt='Group đầy đủ sau chỉnh '+id;panel.append(im)}
  }
  for(const region of x.artboard_regions||[]){const board=x.scan?.artboards?.find(a=>a.index===region.artboard_index);if(board?.preview){let wrap=el('div','');wrap.style.cssText='position:relative;width:100%';let img=el('img','');img.src='data:image/png;base64,'+board.preview;img.style.cssText='display:block;max-width:100%;max-height:none;margin:0;width:100%';wrap.append(img);let mark=el('div','');let q=region.box;mark.style.cssText='position:absolute;border:2px solid red;box-sizing:border-box;left:'+(q[0]*100)+'%;top:'+(q[1]*100)+'%;width:'+((q[2]-q[0])*100)+'%;height:'+((q[3]-q[1])*100)+'%';wrap.append(mark);panel.append(el('p','Vùng chọn trên artboard: '+region.description),wrap)}}
  if(x.maket_filter){panel.append(el('p','Đối chiếu maket: '+x.maket_filter.total+' cụm → giữ '+x.maket_filter.kept.length));let excluded=el('details','');excluded.append(el('summary','Cụm đã loại và lý do'));for(const item of x.maket_filter.excluded)excluded.append(el('p',item.id+': '+item.reason));panel.append(excluded)}
  for(const region of x.maket_regions||[]){let compare=el('div','');compare.append(el('h4','Vùng maket ↔ artwork: '+region.side),el('p',region.description));let image=el('img','');image.src='data:image/png;base64,'+region.preview;image.alt='Vùng maket AI xác định';compare.append(image);for(const id of region.candidate_ids){let c=x.scan?.candidates?.find(c=>c.id===id);if(c){let img=el('img','');img.src='data:image/png;base64,'+c.preview;img.style.background='#777';img.alt='Cụm '+id;compare.append(img,el('span',id))}}panel.append(compare)}

<script>
// Presentation layer only: reuse existing detail controls and API handlers.
(function(){
const title=document.querySelector('h1'),intro=title.nextElementSibling,refreshButton=intro.nextElementSibling;
const header=el('header','');header.className='page-head';const heading=el('div','');heading.append(title,el('p','Theo dõi nguồn, kiểm tra và điều phối xuất file'));const right=el('div','');right.append(refreshButton);header.append(heading,right);document.body.prepend(header);intro.className='notice';header.after(intro);
const metrics=el('nav','');metrics.className='metrics';metrics.setAttribute('aria-label','Lọc hồ sơ theo trạng thái');intro.after(metrics);
const settings=$('management-settings').parentElement,system=$('status').parentElement;
const technical=el('details','');technical.className='technical';technical.append(el('summary','Hệ thống & cấu hình'),$('zalo-sender'),system,settings,$('audit-links'));
const workspace=el('main','');workspace.className='workspace';const queue=el('aside','');queue.className='queue';queue.id='queue';const queueHead=el('div','');queueHead.className='queue-head';$('search').setAttribute('aria-label','Tìm hồ sơ');$('filter').setAttribute('aria-label','Lọc trạng thái hồ sơ');queueHead.append(el('h2','Danh sách hồ sơ'),$('search'),$('filter'));const count=el('div','');count.className='queue-meta';queueHead.append(count);queue.append(queueHead,$('list'));workspace.append(queue,$('detail'));metrics.after($('error'),workspace,$('summary'),technical);$('layout').remove();
const blank=el('div','');blank.className='empty';blank.append(el('strong','Chọn hồ sơ để bắt đầu'),el('p','Xem nguồn, kiểm tra tiến trình và chọn thao tác trong từng mục.'));$('detail').replaceChildren(blank);
const definitions=[['sample','Lên mẫu',x=>x.kind==='sample'],['all','Cần xử lý',x=>true],['review','Cần kiểm tra',x=>['review','uncertain'].includes(x.state)],['sources','Chờ nguồn',x=>['waiting_sources','collecting_sources'].includes(x.state)],['not_started','Chưa bắt đầu',x=>x.state==='not_started'],['running','Đang chờ / chạy',x=>busy.includes(x.state)],['history','Lịch sử',x=>true]];
let sampleOption=el('option','Lên mẫu');sampleOption.value='sample';$('filter').append(sampleOption);
let sourceOption=el('option','Chờ nguồn');sourceOption.value='sources';$('filter').append(sourceOption);
render=function(){const q=$('search').value.toLocaleLowerCase('vi'),f=$('filter').value;metrics.replaceChildren();for(const [key,label,predicate] of definitions){const n=(key==='history'?history:rows).filter(predicate).length;const btn=el('button','');btn.className='metric';btn.setAttribute('aria-pressed',String(f===key));btn.append(el('strong',String(n)),el('span',label));btn.onclick=()=>{$('filter').value=key;render()};metrics.append(btn)}
const match=definitions.find(d=>d[0]===f)?.[2]||(()=>true),items=(f==='history'?history:rows).filter(x=>match(x)&&(x.title+' '+(x.reason||'')).toLocaleLowerCase('vi').includes(q));count.textContent=items.length+' hồ sơ · Mới nhất trước';const list=$('list');list.replaceChildren();for(const x of items){const card=el('article','');card.dataset.id=x.id;card.classList.toggle('selected',x.id===selected);const state=el('span',x.state==='collecting_sources'?'Đang gom nguồn':x.state==='waiting_sources'?'Chờ đủ nguồn':labels[x.state]||x.state);state.className='badge '+x.state;const reason=el('p',x.reason||'Chưa có ghi chú xử lý');reason.className='reason';reason.title=x.reason||'';const open=el('button','Xem / điều phối');open.onclick=()=>show(x.id);card.append(el('h3',x.title),state,reason,el('p',formatCreated(x.created)),open);list.append(card)}if(!items.length){const empty=el('p','Không có hồ sơ phù hợp. Thử đổi bộ lọc hoặc từ khóa.');empty.className='empty';list.append(empty)}};
const originalShow=show;show=async function(id){await originalShow(id);if(selected!==id)return;for(const card of $('list').children)card.classList.toggle('selected',card.dataset.id===id);const detail=$('detail');if(!detail.querySelector('h2'))return;const nodes=[...detail.children],tabs=el('div','');tabs.className='detail-tabs';tabs.setAttribute('role','tablist');tabs.setAttribute('aria-label','Chi tiết hồ sơ');const names=['Tổng quan & nguồn','Tiến trình','Điều phối','Phương án','Chẩn đoán'];const panes=names.map((name,i)=>{const p=el('div','');p.className='detail-pane';p.id='pane-'+i;p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+i);p.hidden=i!==0;return p});let current=0;for(const node of nodes.slice(1)){if(node.tagName==='H3'&&node.textContent==='Tiến trình và nguyên nhân')current=1;if(node.tagName==='H3'&&node.textContent==='Yêu cầu xử lý mới')current=2;let target=current;if(node.tagName==='SECTION'&&current!==2){const h=node.querySelector('h3')?.textContent||'';target=h.startsWith('Phương án')?3:h.startsWith('Chi tiết đọc')?4:1}if(target===0&&node.tagName==='DETAILS')node.open=true;panes[target].append(node)}const record=[...rows,...history].find(x=>x.id===id);if(record?.reason){const reason=el('p',record.reason);reason.style.cssText='padding:12px;background:#fff8e8;border-radius:8px';panes[0].prepend(reason)}
names.forEach((name,i)=>{const b=el('button',name);b.id='tab-'+i;b.setAttribute('role','tab');b.setAttribute('aria-controls','pane-'+i);b.setAttribute('aria-selected',String(i===0));b.tabIndex=i===0?0:-1;const activate=()=>{panes.forEach((p,j)=>p.hidden=i!==j);[...tabs.children].forEach((t,j)=>{t.setAttribute('aria-selected',String(i===j));t.tabIndex=i===j?0:-1})};b.onclick=activate;b.onkeydown=e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?names.length-1:(i+(e.key==='ArrowRight'?1:-1)+names.length)%names.length;tabs.children[j].click();tabs.children[j].focus()}};tabs.append(b);if(!panes[i].childNodes.length)panes[i].append(el('p','Chưa có dữ liệu cho mục này.'))});const back=el('button','← Danh sách hồ sơ');back.className='back-list';back.onclick=()=>$('queue').scrollIntoView({behavior:'smooth'});detail.prepend(back);detail.append(tabs,...panes);detail.scrollTop=0;if(matchMedia('(max-width:850px)').matches)detail.scrollIntoView({behavior:'smooth',block:'start'});
};
const sender=$('zalo-sender'),senderBadge=el('p','Đang đọc trạng thái Zalo…');senderBadge.id='system-badge';right.append(senderBadge);new MutationObserver(()=>{const h=sender.querySelector('h3');senderBadge.textContent=h?h.textContent:sender.textContent;const warning=/ĐÃ CŨ|chưa lấy được/.test(sender.textContent);if(warning)senderBadge.textContent+=' · Cần kiểm tra';senderBadge.style.color=warning?'#b45309':'#526078'}).observe(sender,{childList:true,subtree:true});
if(embedded){queue.style.display='none';metrics.style.display='none';workspace.style.display='block'}
})();

const originalSampleShow=show;
show=async function(id){const row=[...rows,...history].find(x=>x.id===id);if(row?.kind!=='sample')return originalSampleShow(id);selected=id;const b=document.getElementById('detail');b.replaceChildren();try{const d=await api('/api/dispatch/'+id);b.append(el('h2',d.title),el('p','Lên mẫu · Không tạo đơn ERP · Chỉ duyệt nội bộ'));for(const r of d.requirements||[])b.append(el('p',typeof r==='string'?r:JSON.stringify(r)));for(const j of d.jobs||[])b.append(el('p',j.state+' · '+j.reason),el('p',j.path||''));}catch(e){b.append(el('p',e.message));}};
</script>

<script>
(()=>{
 const root=document.body, filePane=document.createElement('section');filePane.id='file-management-pane';
 for(const child of [...root.children])if(!['SCRIPT','STYLE'].includes(child.tagName))filePane.append(child);
 root.prepend(filePane);
 const heading=filePane.querySelector('h1');if(heading)heading.textContent='Điều phối file in';
 const header=document.createElement('header');header.className='control-header';header.innerHTML='<h1>Quản lý đơn & file in</h1><p>Theo dõi tiếp nhận đơn, điều phối xuất file và tình trạng dịch vụ tại một nơi.</p>';
 const nav=document.createElement('nav');nav.className='control-nav';nav.setAttribute('aria-label','Khu vực quản lý');
 const orderPane=document.createElement('section');orderPane.id='order-management-pane';orderPane.hidden=true;
 orderPane.innerHTML=`<h2>Tiếp nhận & lên đơn ERP</h2><p>Hub gom tin theo nhóm, chờ đủ thời gian từ tin khách cuối rồi mới xử lý. Lịch sử 7 ngày; giữ riêng dấu vết chống trùng.</p><form id="local-intake-config"><label>Chờ gom tin (phút) <input id="local-wait" type="number" min="1" max="120" required></label> <label><input id="local-zalo" type="checkbox"> Zalo</label> <label><input id="local-whatsapp" type="checkbox"> WhatsApp</label> <label><input id="local-viber" type="checkbox"> Viber</label> <button id="local-save" disabled>Lưu cấu hình</button></form><p id="local-intake-status" role="status"></p><label>Ngày <input type="date" id="local-date"></label> <select id="local-state"><option value="all">Tất cả trạng thái</option><option value="done">Đã lên / chống trùng</option><option value="waiting">Đang chờ</option><option value="review">Cần kiểm tra</option><option value="history">Không tạo đơn / đã đóng</option></select> <input id="local-search" placeholder="Tìm nhóm khách"><button id="local-refresh" type="button">Làm mới</button><p id="local-count"></p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Ngày giờ</th><th>Nhóm / nguồn</th><th>Trạng thái</th><th>Kết quả / đơn ERP</th></tr></thead><tbody id="local-intake-rows"></tbody></table></div>`;
 let intakeRows=[],revision=0,dirty=false;
 const by=id=>orderPane.querySelector('#'+id);
 function drawIntake(){const body=by('local-intake-rows');body.replaceChildren();let n=0;for(const x of intakeRows){const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(x.created*1000));const state=x.display_group||(['created','duplicate'].includes(x.state)?'done':['review','uncertain'].includes(x.state)?'review':['ignored','superseded'].includes(x.state)?'history':'waiting');if(by('local-date').value&&day!==by('local-date').value)continue;if(by('local-state').value!=='all'&&state!==by('local-state').value)continue;if(!(x.group||'').toLocaleLowerCase().includes(by('local-search').value.toLocaleLowerCase()))continue;n++;const tr=document.createElement('tr');for(const value of [new Date(x.created*1000).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}),(x.group||'')+' · '+x.kind,({done:'Đã lên / chống trùng',waiting:'Đang chờ',review:'Cần kiểm tra',history:'Không tạo đơn / đã đóng'})[state]||x.state,x.reason||x.classification_reason||'']){const td=document.createElement('td');td.style.cssText='padding:12px;border-bottom:1px solid #ddd;vertical-align:top';td.textContent=value;tr.append(td)}for(const o of x.orders||[]){if(!/^[a-f0-9-]{36}$/i.test(o.id||''))continue;const link=document.createElement('a');link.href='http://192.168.1.203:8000/don-hang?don='+encodeURIComponent(o.id);link.target='_blank';link.rel='noopener';link.textContent=' '+(o.code||o.id);tr.lastChild.append(link)}if(x.steps&&x.steps.length){const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Chi tiết '+x.steps.length+' bước';detail.append(summary);for(const step of x.steps){const line=document.createElement('div');line.style.cssText='padding:8px;border-top:1px solid #ddd';line.textContent=new Date(step.created*1000).toLocaleString('vi-VN')+' · '+step.state+' · '+(step.reason||step.classification_reason||'');detail.append(line)}tr.lastChild.append(detail)}body.append(tr)}by('local-count').textContent=n+' / '+intakeRows.length+' đợt trong 7 ngày';}
 async function loadIntake(){try{const r=await fetch('/api/dispatch/intake');const d=await r.json();if(!r.ok)throw Error(d.detail||'Không kết nối Hub');intakeRows=d.snapshot.items;if(!dirty){revision=d.settings.revision;by('local-wait').value=d.settings.wait_minutes;for(const k of ['zalo','whatsapp','viber'])by('local-'+k).checked=d.settings.channels[k]}by('local-save').disabled=false;by('local-intake-status').textContent='Đọc trực tiếp Hub · Cấu hình v'+d.settings.revision+' · '+new Date(d.updated*1000).toLocaleString('vi-VN');drawIntake()}catch(e){by('local-intake-status').textContent='Không tải được Hub: '+e.message;by('local-save').disabled=true}}
 by('local-intake-config').oninput=()=>dirty=true;
 by('local-intake-config').onsubmit=async e=>{e.preventDefault();by('local-save').disabled=true;try{const session=await (await fetch('/api/session')).json();const r=await fetch('/api/dispatch/intake',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':session.csrf},body:JSON.stringify({revision,wait_minutes:Number(by('local-wait').value),channels:Object.fromEntries(['zalo','whatsapp','viber'].map(k=>[k,by('local-'+k).checked]))})});const d=await r.json();if(!r.ok)throw Error(d.detail);dirty=false;await loadIntake()}catch(e){by('local-intake-status').textContent=e.message;by('local-save').disabled=false}};
 for(const id of ['local-date','local-state','local-search'])by(id).oninput=drawIntake;by('local-refresh').onclick=loadIntake;
 
 const systemPane=document.createElement('section');systemPane.hidden=true;const systemHeading=document.createElement('h2');systemHeading.textContent='Trạng thái hệ thống';systemPane.append(systemHeading);
 const status=document.getElementById('status');if(status){const wrapper=status.closest('details');if(wrapper){wrapper.open=true;systemPane.append(wrapper)}}
 const sender=document.getElementById('zalo-sender');if(sender)systemPane.append(sender);
 const activityPane=document.createElement('section');activityPane.id='activity-pane';activityPane.hidden=true;
 const panes=[orderPane,filePane,systemPane,activityPane],titles=['Tiếp nhận & lên đơn','Điều phối file in','Trạng thái hệ thống','Luồng Thực Thi'];
 function select(index){panes.forEach((p,i)=>p.hidden=i!==index);[...nav.children].forEach((b,i)=>b.setAttribute('aria-selected',String(i===index)));if(index===0)loadIntake();sessionStorage.setItem('management-tab',String(index))}
 titles.forEach((title,index)=>{const b=document.createElement('button');b.type='button';b.textContent=title;b.onclick=()=>select(index);nav.append(b)});
 root.prepend(header,nav);root.append(orderPane,systemPane,activityPane);
 select(location.hash.includes('brief=')?1:Number(sessionStorage.getItem('management-tab')||0));
})();
</script>

<script>
(()=>{
const box=document.getElementById('activity-pane'),el=(t,v='')=>{const e=document.createElement(t);e.textContent=v;return e};

function nodeDetails(area,n){
 const g=nodeGuide[n[0]];if(!g)return;
 const wrap=el('section');wrap.className='node-guide';wrap.dataset.node=n[0];
 wrap.append(el('p','Quy tắc xử lý của bước này — không phải kết luận một hồ sơ đã chạy. Chọn cụm ở trên để xem kết quả thực tế bên dưới.'));
 wrap.append(el('h4','Đầu vào cần có'),el('p',g.input));
 if(n[0]==='source')wrap.append(el('p','Thời gian gom đang cấu hình: '+data.wait_minutes+' phút kể từ tin cuối hợp lệ.'));
 wrap.append(el('h4','Các trường hợp và hướng xử lý'));
 const table=el('table'),thead=el('thead'),hr=el('tr');for(const text of ['Trường hợp','Hub xử lý như thế nào','Kết quả / điểm dừng'])hr.append(el('th',text));thead.append(hr);table.append(thead);
 const tbody=el('tbody');for(const row of g.cases){const tr=el('tr');for(const value of row)tr.append(el('td',value));tbody.append(tr)}table.append(tbody);const scroll=el('div');scroll.style.overflowX='auto';scroll.append(table);wrap.append(scroll);
 const tail=el('div');tail.className='node-guide-tail';for(const [title,value] of [['Đầu ra / đi tiếp',g.result],['Điều kiện an toàn / không được làm',g.guard]]){const item=el('div');item.append(el('h4',title),el('p',value));tail.append(item)}wrap.append(tail);
 const refs=el('details');refs.append(el('summary','Code liên quan để đối chiếu'),el('p',g.source));wrap.append(refs);
 const actual=el('div');actual.className='node-live-context';actual.append(el('h4','Dữ liệu đang đối chiếu'));
 if(!scope)actual.append(el('p','Chưa chọn một cụm cụ thể. Các danh sách bên dưới đang hiển thị phạm vi gần nhất, không chứng minh node này đã chạy cho tất cả cụm.'));
 else for(const b of scoped()){actual.append(el('strong',b.group),el('p',formatCreated(b.created)+' · '+b.messages.length+' tin · '+b.messages.reduce((v,m)=>v+(m.images||0),0)+' ảnh · '+b.messages.reduce((v,m)=>v+(m.files||[]).length,0)+' tệp'),el('p','Trạng thái hồ sơ: '+stateLabel(b.state)+' · '+(b.reason||'Chưa có lý do được ghi')));actual.append(el('p','Đơn ERP được ghi nhận: '+(b.orders.map(o=>o.code||o.id).join(', ')||'Chưa có mã đơn trong kết quả')));}
 wrap.append(actual);area.append(wrap);
}
function planTable(parent,catalog){
 if(!catalog?.models?.length)return;
 const table=el('table');table.className='node-plan-table';const hr=el('tr');for(const h of ['Mẫu / phần in','Loại dàn','Trang / nguồn','Nền / hướng','Kích thước / chu kỳ','Thiếu / cần kiểm tra'])hr.append(el('th',h));table.append(hr);
 for(const m of catalog.models)for(const p of m.parts||[]){const tr=el('tr');for(const v of [m.code+' / '+(p.name||p.id),p.kind,(p.boards||[]).join(', ')+' · '+(p.sources||[]).join(', '),(p.background_strategy||p.background||'')+' · '+(p.orientation||''),(p.dimensions||'')+' · '+(p.repeat||''),(p.missing||[]).join('; ')||'Không ghi thiếu trong phân loại; vẫn phải kiểm chứng xuất'])tr.append(el('td',v));table.append(tr)}
 const scroll=el('div');scroll.style.overflowX='auto';scroll.append(table);parent.append(el('h4','Phương án từng mẫu / từng phần'),scroll);
}

function focus(){const area=document.getElementById('flow-focus');area.replaceChildren();const n=nodes.find(x=>x[0]===selected);area.append(el('h3',n[1]),el('p',n[2]));nodeDetails(area,n);if(n[6]){const k=n[6],label=el('label','Model cho lượt tiếp theo: '),input=el('input');input.value=data.models[k];input.placeholder='Giữ mặc định: '+data.defaults[k];input.oninput=()=>editing=true;const save=el('button','Lưu model');save.onclick=async()=>{save.disabled=true;try{const sess=await(await fetch('/api/session')).json();const r=await fetch('/api/dispatch/execution',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':sess.csrf},body:JSON.stringify({...data.models,[k]:input.value.trim()})});const v=await r.json();if(!r.ok)throw Error(v.detail||r.status);data.models=v;editing=false;area.append(el('p','Đã lưu. Không chạy lại việc đã xong.'))}catch(e){area.append(el('p',e.message))}finally{save.disabled=false}};label.append(input);area.append(label,save,el('p',k==='redraw'?'Áp dụng adapter vẽ lại OpenAI. Làm nét/tách nền Replicate là tác vụ riêng.':'Áp dụng model Gemini cùng API đã cấu hình; chọn artwork/đọc ảnh dùng chung cấu hình vision. Để trống giữ model từng bước hiện tại.'))}
if(selected==='no_action')area.append(el('p','Khi phân loại chắc chắn toàn cụm không có đặt hàng/làm mẫu/duyệt in, Hub kết thúc tại đây. Có yêu cầu mới hoặc chưa rõ thì không tự bỏ nguồn. ignored có thể là chuyển sang PSD; đọc lý do, không coi mọi ignored là trao đổi thông thường.'));
if(['pattern_meter','ready_layout','unknown'].includes(selected))area.append(el('p','Nhánh phân loại có trong code; tự xuất còn phụ thuộc kiểm chứng. Hoa văn phải có chu kỳ/hướng nối xác định; không mặc định cao 20 cm.'));
if(selected==='agent'){
const d=el('details');d.className='flow-detail';d.append(el('summary','Xem / sửa prompt AI đang dùng'));
d.append(el('p','Các prompt theo vai trò: phân loại trước, Agent công cụ, kiểm chứng đề xuất. Không phải cụm nào cũng gọi đủ cả ba; bộ lọc/cache có thể bỏ qua bước, lỗi có thể phát sinh thêm lượt. Lưu áp dụng lượt mới, không chạy lại lịch sử. Giữ cấu trúc JSON/tool trong prompt; kiểm tra ID nguồn và chống trùng bằng code vẫn bắt buộc.'));

for(const [k,label] of Object.entries(names)){const t=el('textarea');t.value=data.prompts[k];t.rows=12;t.style.width='100%';t.oninput=()=>editing=true;inputs[k]=t;d.append(el('h4',label),t)}
const save=el('button','Lưu các prompt');save.onclick=async()=>{save.disabled=true;try{const sess=await(await fetch('/api/session')).json();const prompts=Object.fromEntries(Object.entries(inputs).map(([k,t])=>[k,t.value]));const r=await fetch('/api/dispatch/execution',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF':sess.csrf},body:JSON.stringify({...data.models,prompts})});const v=await r.json();if(!r.ok)throw Error(v.detail||r.status);data.models=v;data.prompts=prompts;editing=false;d.append(el('p','Đã lưu prompt cho lượt mới. Không chạy lại việc cũ.'))}catch(e){d.append(el('p',e.message))}finally{save.disabled=false}};d.append(save);area.append(d);
}
if(selected==='jpg')area.append(el('p','Một artboard có thể gồm nhiều phần: thân, quai, hông, đáy. Nền trắng / màu trơn / sọc liền tấm / hoa văn từng mặt là chiến lược nền, không phải một đơn mới. Giữ nguyên kích thước logo, nền trắng của logo, co vải và cữ theo maket.'));
}
function renderUsage(d,b){const u=data.ai_usage?.batches?.[b.id];d.append(el('h4','Lượt gọi AI · token · chi phí'));if(!u){d.append(el('p','Chưa có số liệu ghi nhận.'));return;}d.append(el('p',u.calls+' lượt API ghi nhận · '+u.cache_hits+' lượt dùng lại cache'));if(!u.covered)d.append(el('p','Cụm cũ hoặc chưa vào bước đo: chưa có thống kê đầy đủ. Không coi thiếu dữ liệu là không gọi AI.'));

for(const c of u.rows){const tr=el('tr');for(const text of [formatCreated(c.started)+' · '+c.stage,c.model+' · '+c.state,(c.tokens.input??'?')+' / '+(c.tokens.output??'?')+' / '+c.tokens.thinking,c.estimated_usd===null?'Chưa rõ':'$'+c.estimated_usd.toFixed(6),(c.same_input_repeat?'Đầu vào giống lượt trước: kiểm tra retry/gọi thừa. ':'')+(c.shared_file?'Hồ sơ file dùng chung; không cộng chéo. ':'')+(c.error||'')])tr.append(el('td',text));table.append(tr)}const wrap=el('div');wrap.style.overflow='auto';wrap.append(table);d.append(wrap);}
function draw(){if(!data)return;for(const n of nodes)document.getElementById('fg-'+n[0]).classList.toggle('active',n[0]===selected);document.querySelectorAll('#fg-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.pane===pane));if(!editing)focus();const root=document.getElementById('flow-detail');root.replaceChildren();const batches=scoped();

if(pane==='chat'){root.append(el('p','20 hồ sơ gần nhất; chọn cụm ở trên. Đây là các ID nguồn gắn với hồ sơ intake của Hub, gồm cả hồ sơ con sau tách mẫu. Nội dung lấy từ bản lưu hiện có; không tự gọi AI.'));
for(const b of batches){const d=el('details');d.className='flow-detail';if(scope)d.open=true;d.append(el('summary',b.group+' · '+formatCreated(b.created)+' · '+b.messages.length+' tin · '+stateLabel(b.state)));for(const m of b.messages){const card=el('div');card.className='flow-message '+(m.role==='staff'?'staff':'');card.append(el('strong',m.sender+' · '+m.role+' · '+formatCreated(m.time)),el('p',m.text));if(m.quoted_file){const q=m.quoted_file;card.append(el('p','↪ Trả lời file: '+(q.name||'Chưa lấy được tên')+' · '+(q.timestamp?formatCreated(q.timestamp):'Chưa rõ ngày')+' · '+(q.resolved?'Đã đối chiếu tin gốc':'Chưa lấy được nguồn: '+q.error)),el('small','ID file gốc: '+q.message_id));}for(const url of m.image_urls||[]){const a=el('a');a.href=url;a.target='_blank';const im=el('img');im.src=url;im.loading='lazy';im.alt='Ảnh nguồn '+m.id;a.append(im);card.append(a)}for(const f of m.files)card.append(el('p','📎 '+f.name+' · '+f.state),el('small',f.path));card.append(el('small','Tin nguồn: '+m.id));d.append(card)}root.append(d)}}
if(pane==='ai'){if(data.ai_usage){root.append(el('p',data.ai_usage.note));const link=el('a','Bảng giá tham chiếu '+data.ai_usage.price_date);link.href=data.ai_usage.price_source;link.target='_blank';root.append(link);}root.append(el('p','Kết quả đã lưu theo hồ sơ. Không suy trạng thái “đã đọc ảnh” chỉ từ việc có ảnh.'));for(const b of batches){const d=el('details');d.className='flow-detail';if(scope)d.open=true;d.append(el('summary',b.group+' · '+formatCreated(b.created)+' · '+stateLabel(b.state)));renderUsage(d,b);d.append(el('h4','Kết luận phân loại trước khi đọc ảnh'));json(d,b.classification);d.append(el('h4','Kết quả cuối'));json(d,b.analysis);d.append(el('h4','Các công cụ Agent đã thực hiện'));json(d,b.agent_trace);d.append(el('p','Nguồn: '+b.source_ids.join(', ')));root.append(d)}const logs=el('details');logs.append(el('summary','Lượt AI xuất file đã ghi model thực tế'));for(const c of data.print_api.calls)logs.append(el('p',formatCreated(c.started)+' · '+c.stage+' · '+c.model+' · '+c.state+' · '+(c.error||'')+' · '+(c.job_id||'chưa gắn hồ sơ')));root.append(logs)}
if(pane==='erp'){for(const b of batches){const d=el('div');d.className='flow-detail';d.append(el('strong',b.group+' · '+stateLabel(b.state)),el('p',b.reason));for(const o of b.orders){const a=el('a',o.code||o.id);a.href='http://192.168.1.203:8000/don-hang?don='+encodeURIComponent(o.id);a.target='_blank';d.append(a,el('br'))}if(!b.orders.length)d.append(el('p','Chưa có mã đơn được lưu trong kết quả này.'));root.append(d)}}
if(pane==='files'){let count=0;const ids=new Set(batches.flatMap(b=>b.source_ids));for(const f of [...data.files.pending,...data.files.history]){if(scope&&!batches.some(b=>b.account===f.account&&(f.source_ids||[]).some(x=>b.source_ids.includes(x))))continue;const steps=data.steps[f.id]||[];const kindFilter={pet:'pet_exports',jpg:'jpg_exports',psd:'psd_samples',redraw:'pet_exports'}[selected];if(kindFilter&&!steps.some(s=>s.kind===kindFilter))continue;const kinds=['single_face','separate_faces','joined_faces','solid_meter','pattern_meter','ready_layout','unknown'];if(kinds.includes(selected)&&!steps.some(s=>JSON.stringify(s.catalog||{}).includes('"'+selected+'"')))continue;count++;const d=el('details');d.className='flow-detail';d.append(el('summary',f.title+' · '+f.state),el('p',f.reason));for(const s of steps){const sub=el('details');sub.append(el('summary',formatCreated(s.created)+' → '+s.kind+' → '+s.state),el('p',s.reason||''));if(s.catalog&&Object.keys(s.catalog).length){planTable(sub,s.catalog);const raw=el('details');raw.append(el('summary','JSON phân loại gốc'));json(raw,s.catalog);sub.append(raw);}if(s.plan&&Object.keys(s.plan).length)json(sub,s.plan);if(s.blocked_parts?.length)json(sub,s.blocked_parts);d.append(sub)}const a=el('a','Mở hồ sơ / preview trong Điều phối file in');a.href='/#brief='+f.id;a.target='_blank';d.append(a);root.append(d)}if(!count)root.append(el('p','Chưa có hồ sơ khớp nguồn / loại này trong 30 hồ sơ gần nhất. Không tự gán theo tên gần giống.'))}
if(pane==='approval'){root.append(el('p','Nhận xác nhận → đối chiếu mẫu → tổng hợp → bàn giao API 101. submitted/queued chưa chứng minh đã gửi; uncertain giữ khóa không gửi lại.'));for(const a of data.approvals){if(scope&&!batches.some(b=>b.account===a.account&&b.thread_id===a.thread_id))continue;const d=el('details');d.className='flow-detail';d.append(el('summary',a.group+' · '+formatCreated(a.created)+' · '+a.state),el('p','Tin xác nhận: '+a.confirmation_id));json(d,a.summary);json(d,a.deliveries);root.append(d)}}}
async function load(){if(loading)return;loading=true;try{const r=await fetch('/api/dispatch/execution');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();const select=document.getElementById('fg-scope');select.replaceChildren(el('option','Tất cả hồ sơ đang hiển thị'));select.firstChild.value='';for(const b of data.batches){const o=el('option',b.group+' · '+formatCreated(b.created)+' · '+b.messages.length+' tin');o.value=b.id;select.append(o)}select.value=scope;draw();document.getElementById('fg-status').textContent=' · Hub cập nhật '+formatCreated(data.updated)+' · n8n ngắt';}catch(e){document.getElementById('fg-status').textContent='Không đọc được Hub: '+e.message}finally{loading=false}}
document.getElementById('fg-scope').onchange=e=>{scope=e.target.value;draw()};document.getElementById('fg-refresh').onclick=load;new MutationObserver(()=>{if(!box.hidden){fit();load()}}).observe(box,{attributes:true,attributeFilter:['hidden']});if(!box.hidden)load();
